<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Today Card — one card for the day</title>
<style>
  :root{--bg:#0f1115;--card:#171a21;--ink:#e7e9ee;--mut:#9aa3b2;--line:#252a34;--acc:#22c55e}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
  header,main,footer{max-width:640px;margin:0 auto;padding:20px}
  h1{margin:0;font-size:22px}
  .mut{color:var(--mut)}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin:14px 0}
  label{display:block;font-size:13px;color:var(--mut);margin:10px 0 4px}
  input{width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:#0d1014;color:var(--ink);font-size:15px}
  button{background:var(--acc);color:#06210f;border:0;border-radius:10px;padding:10px 14px;font-weight:600;cursor:pointer;margin-top:12px}
  .row{display:flex;gap:8px;flex-wrap:wrap}
  .ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
  .big{font-size:34px;font-weight:700;margin:0}
</style>
</head>
<body>
<header>
  <h1>Today</h1>
  <p class="mut" id="dateline"></p>
</header>
<main>
  <div class="card">
    <label for="intention">One intention</label>
    <input id="intention" placeholder="How do I want today to feel?">
    <label for="task">One task</label>
    <input id="task" placeholder="The one thing that would make today count.">
    <div class="row">
      <button id="save">Save today</button>
      <button id="theme" class="ghost" type="button">Theme</button>
      <button id="lang" class="ghost" type="button">Language</button>
      <button id="export" class="ghost" type="button">Export</button>
      <button id="copy" class="ghost" type="button">Copy</button>
      <button id="share" class="ghost" type="button" hidden>Share</button>
      <button id="remind" class="ghost" type="button">Remind</button>
    </div>
    <p class="mut" id="status" aria-live="polite"></p>
  </div>
  <div class="card">
    <p class="mut" style="margin:0">Current streak</p>
    <p class="big" id="streak">0 days</p>
  </div>

  <div class="card" id="past-card" hidden>
    <p class="mut" style="margin:0 0 6px" id="past-date"></p>
    <p id="past-intention" style="margin:0 0 8px"></p>
    <p id="past-task" style="margin:0"></p>
    <button class="ghost" id="past-back" type="button">Back to today</button>
  </div>

  <div class="card">
    <p class="mut" style="margin:0 0 8px">Earlier cards</p>
    <ul id="history" style="list-style:none;margin:0;padding:0"></ul>
    <p class="mut" id="history-empty" style="margin:8px 0 0">Nothing saved yet. Today's card is the first.</p>
  </div>
</main>
<footer class="mut">Built with web-kit · offline · © 2026 Dr Sohil Momin</footer>

<script src="web-kit.js"></script>
<script>
  Loom.theme.apply();
  Loom.seo.title("Today Card — one card for the day");
  Loom.seo.description("One card for the day: your date, one intention, one task, and a streak. Offline, no accounts.");

  var days = Loom.storage.get("days", {});

  /* The key is the LOCAL date, not the UTC one.
     toISOString() is UTC, so in India (UTC+5:30) a card written at 02:00 was
     filed under yesterday while the page said today - the note was saved, and
     then not there when you looked for it. */
  function key(d) {
    var y = d.getFullYear(), m = String(d.getMonth() + 1).padStart(2, "0"), day = String(d.getDate()).padStart(2, "0");
    return y + "-" + m + "-" + day;
  }
  var today = key(new Date());

  /* Anything saved under the old UTC key for the same day is adopted, so a card
     written before this fix is not orphaned. */
  var utcKey = new Date().toISOString().slice(0, 10);
  if (utcKey !== today && days[utcKey] && !days[today]) {
    days[today] = days[utcKey];
    delete days[utcKey];
    Loom.storage.set("days", days);
  }

  document.getElementById("dateline").textContent =
    new Date().toLocaleDateString(Loom.i18n.lang, { weekday: "long", day: "numeric", month: "long", year: "numeric" });

  var rec = days[today] || {};
  document.getElementById("intention").value = rec.intention || "";
  document.getElementById("task").value = rec.task || "";

  function streak() {
    var n = 0, d = new Date();
    for (;;) {
      var k = key(d);   /* local key: the cards are filed locally, so UTC broke the streak before 05:30 IST */
      if (days[k]) { n++; d.setDate(d.getDate() - 1); } else break;
    }
    return n;
  }
  function draw() {
    document.getElementById("streak").textContent = streak() + (streak() === 1 ? " day" : " days");
  }
  draw();

  /* Everything you have written, newest first. Without this the app showed only
     today: write a card on Monday, open it on Tuesday, and the words were in
     storage and unreachable. */
  function fmt(k) {
    var d = new Date(k + "T00:00:00");
    return isNaN(d) ? k : d.toLocaleDateString(Loom.i18n.lang, { weekday: "short", day: "numeric", month: "short", year: "numeric" });
  }
  function openPast(k) {
    var rec = days[k] || {};
    document.getElementById("past-date").textContent = fmt(k) + (k === today ? " · today" : "");
    document.getElementById("past-intention").textContent = rec.intention || "—";
    document.getElementById("past-task").textContent = rec.task || "—";
    document.getElementById("past-card").hidden = false;
    document.getElementById("past-card").scrollIntoView({ block: "nearest" });
  }
  /* ---------- delivery --------------------------------------------------
     A card that never leaves the tab is a diary nobody reads. Copy it into a
     message, share it, or drop a daily reminder into the calendar you already
     look at. All offline: no account, no server, nothing running in the
     background, and no notification permission to ask for. */
  function note(m) { document.getElementById("status").textContent = m; }
  function cardText() {
    var r = days[today] || {};
    var lines = [new Date().toLocaleDateString(Loom.i18n.lang,
      { weekday: "long", day: "numeric", month: "long", year: "numeric" })];
    if (r.intention) lines.push("Intention: " + r.intention);
    if (r.task) lines.push("Task: " + r.task);
    if (!r.intention && !r.task) lines.push("(no card saved yet)");
    return lines.join("\n");
  }
  function download(name, text, type) {
    var url = URL.createObjectURL(new Blob([text], { type: type }));
    var a = document.createElement("a");
    a.href = url; a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
  }
  function copyText(text, done) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done, fallback);
      return;
    }
    fallback();
    function fallback() {
      var t = document.createElement("textarea");
      t.value = text; t.style.position = "absolute"; t.style.left = "-9999px";
      document.body.appendChild(t); t.select();
      try { document.execCommand("copy"); done(); } catch (e) {}
      t.remove();
    }
  }
  document.getElementById("copy").addEventListener("click", function () {
    copyText(cardText(), function () { note("Copied. Paste it where the day happens."); });
  });
  var shareBtn = document.getElementById("share");
  if (navigator.share) {
    shareBtn.hidden = false;
    shareBtn.addEventListener("click", function () {
      navigator.share({ title: "Today's card", text: cardText() }).catch(function () {});
    });
  }
  document.getElementById("remind").addEventListener("click", function () {
    var d = new Date(); d.setDate(d.getDate() + 1);
    var day = d.getFullYear() + String(d.getMonth() + 1).padStart(2, "0") + String(d.getDate()).padStart(2, "0");
    var stamp = new Date().toISOString().replace(/[-:]/g, "").split(".")[0] + "Z";
    var ics = ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//drsamonline//Today Card//EN", "CALSCALE:GREGORIAN",
      "BEGIN:VEVENT", "UID:today-card-reminder@drsamonline.github.io", "DTSTAMP:" + stamp,
      "DTSTART;VALUE=DATE:" + day, "RRULE:FREQ=DAILY", "SUMMARY:Fill today's card",
      "DESCRIPTION:One intention\\, one task.", "END:VEVENT", "END:VCALENDAR"].join("\r\n");
    download("today-card-reminder.ics", ics, "text/calendar");
    note("Reminder downloaded. Open it once to add the daily event.");
  });

  function drawHistory() {
    var list = document.getElementById("history");
    var keys = Object.keys(days).sort().reverse();
    list.textContent = "";
    document.getElementById("history-empty").hidden = keys.length > 0;
    keys.forEach(function (k) {
      var rec = days[k] || {};
      var li = document.createElement("li");
      li.style.borderTop = "1px solid var(--line)";
      li.style.padding = "8px 0";
      var b = document.createElement("button");
      b.type = "button";
      b.className = "ghost";
      b.style.cssText = "margin:0;width:100%;text-align:left;padding:8px 10px";
      var bits = [rec.intention, rec.task].filter(Boolean);
      b.textContent = fmt(k) + " — " + (bits.length ? bits.join(" · ") : "(empty card)");
      b.addEventListener("click", function () { openPast(k); });
      li.appendChild(b);
      list.appendChild(li);
    });
  }
  document.getElementById("past-back").addEventListener("click", function () {
    document.getElementById("past-card").hidden = true;
  });
  drawHistory();

  document.getElementById("save").addEventListener("click", function () {
    days[today] = {
      intention: document.getElementById("intention").value.trim(),
      task: document.getElementById("task").value.trim()
    };
    Loom.storage.set("days", days);
    document.getElementById("status").textContent = "Saved for " + today + ".";
    draw();
    drawHistory();
  });

  document.getElementById("theme").addEventListener("click", function () { Loom.theme.toggle(); });
  document.getElementById("lang").addEventListener("click", function () {
    var langs = Loom.i18n.langs();
    Loom.i18n.setLang(langs[(langs.indexOf(Loom.i18n.lang) + 1) % langs.length]);
  });
  document.getElementById("export").addEventListener("click", function () {
    var rows = Object.keys(days).sort().map(function (k) {
      return { date: k, intention: days[k].intention || "", task: days[k].task || "" };
    });
    Loom.csv.download("today-card.csv", Loom.csv.toCSV(rows));
  });
</script>

<style>:focus-visible{outline:2px solid currentColor;outline-offset:2px}</style>
<script>
/* THE FOUR THINGS EVERY APP HERE SHOULD HAVE: export, restore, undo, keyboard.
   All four hook what every app shares - localStorage and document - not each app's internals. */
(function () {
  function typing(e) { var t = e.target || {}; return /^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName) || t.isContentEditable === true; }
  function say(m) { var d = document.createElement("div"); d.textContent = m; d.style.cssText = "position:fixed;left:50%;transform:translateX(-50%);bottom:96px;background:#111;color:#eee;border:1px solid #444;border-radius:8px;padding:8px 14px;font:13px system-ui;z-index:10000"; document.body.appendChild(d); setTimeout(function () { d.remove(); }, 1700); }
  window.__exportAll = function () {
    var out = { app: document.title, exported: new Date().toISOString(), storage: {} };
    try { for (var i = 0; i < localStorage.length; i++) { var k = localStorage.key(i); if (k && k.indexOf("__") !== 0) out.storage[k] = localStorage.getItem(k); } } catch (e) { out.storageError = String(e); }
    var name = (document.title || "app").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "") + "-data-" + new Date().toISOString().slice(0, 10) + ".json";
    var json = JSON.stringify(out, null, 2);
    if (window.Export && typeof Export.save === "function") Export.save(name, json, "application/json");
    else { var a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([json], { type: "application/json" })); a.download = name; document.body.appendChild(a); a.click(); setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 1000); }
    return name;
  };
  window.__importAll = function () {
    var inp = document.createElement("input"); inp.type = "file"; inp.accept = ".json,application/json";
    inp.onchange = function () {
      var f = inp.files && inp.files[0]; if (!f) return;
      var r = new FileReader();
      r.onload = function () {
        var data; try { data = JSON.parse(String(r.result)); } catch (e) { alert("That is not a JSON backup."); return; }
        var store = data && (data.storage || data.localStorage || data);
        if (!store || typeof store !== "object") { alert("No stored data found in that file."); return; }
        var keys = Object.keys(store); if (!keys.length) { alert("That backup is empty."); return; }
        if (!confirm("This backup has " + keys.length + " item(s).\n\nRESTORE THEM? This replaces what this app has stored now.")) return;
        keys.forEach(function (k) { var v = store[k]; localStorage.setItem(k, typeof v === "string" ? v : JSON.stringify(v)); });
        alert("Restored " + keys.length + " item(s). Reloading."); location.reload();
      };
      r.readAsText(f);
    };
    inp.click();
  };
  var history = [], orig = localStorage.setItem.bind(localStorage);
  localStorage.setItem = function (k, v) {
    try { var prev = localStorage.getItem(k); if (prev !== String(v) && String(k).indexOf("__") !== 0) { history.push({ k: k, prev: prev }); if (history.length > 60) history.shift(); } } catch (e) {}
    return orig(k, v);
  };
  window.__undo = function () {
    var h = history.pop(); if (!h) { say("Nothing to undo"); return false; }
    try { if (h.prev === null) localStorage.removeItem(h.k); else orig(h.k, h.prev); } catch (e) { say("Could not undo"); return false; }
    say("Undone. Reloading."); setTimeout(function () { location.reload(); }, 350); return true;
  };
  /* The floating cluster, its keyboard overlay and its Ctrl+Z handler were removed by
   the owner: they sat over each app's own controls and fought its own shortcuts.
   The export/import/undo functions above remain callable from an app's own menu. */
})();
</script>

<script>
window.__smokeTest = function () {
  var out = []; function ok(n, c) { out.push((c ? "PASS " : "FAIL ") + n); }
  ok("the document rendered", !!document.body && document.body.children.length > 0);
  ok("a heading is present", !!document.querySelector("h1, h2"));
  ok("no script threw during load", !window.__bootError);
  var kits = ["Export","Loom","CryptoKit","Case","Search","Srs","Game","Art","Audio","Ml","UI","Lan","Astro"];
  var found = kits.filter(function (k) { return window[k]; });
  ok("at least one kit is loaded (" + (found.join(", ") || "none") + ")", found.length > 0);
  try { localStorage.setItem("__smoke","1"); ok("storage works", localStorage.getItem("__smoke") === "1"); localStorage.removeItem("__smoke"); } catch (e) { ok("storage works", false); }
  console.log(out.join("\n"));
  if (location.search.indexOf("test") >= 0) { var d = document.createElement("pre"); d.textContent = out.join("\n"); d.style.cssText = "position:fixed;left:0;right:0;bottom:0;background:#111;color:#eee;padding:12px;font:12px ui-monospace,monospace;z-index:99999;max-height:40vh;overflow:auto;white-space:pre-wrap"; document.body.appendChild(d); }
  return out;
};
window.addEventListener("error", function () { window.__bootError = true; });
</script>

<script>
/* THE SPEC'S DONE-MEANS, AS A TEST - the four things, the empty day, and the streak.
   Open with ?test to see it. */
window.__todayCardTest = function () {
  var out = [], ok = function (n, c) { out.push((c ? "PASS " : "FAIL ") + n); };
  var g = function (id) { return document.getElementById(id); };
  ok("the dateline renders and is not empty", !!g("dateline") && g("dateline").textContent.trim().length > 0);
  ok("there is one intention field", !!g("intention"));
  ok("there is one task field", !!g("task"));
  ok("there is a streak", !!g("streak"));
  ok("the card shows exactly four things (dateline, intention, task, streak)",
     ["dateline","intention","task","streak"].every(function (id) { return !!g(id); })
     && document.querySelectorAll("#card .row").length <= 6);
  var days = {};
  try { days = JSON.parse(localStorage.getItem("days") || "{}"); } catch (e) {}
  var t = new Date().toISOString().slice(0, 10);
  var has = !!days[t];
  ok("today has a record: " + has, has === (g("intention").value.trim().length > 0 || g("task").value.trim().length > 0));
  var n = 0, d = new Date();
  for (;;) { var k = d.toISOString().slice(0, 10); if (days[k]) { n++; d.setDate(d.getDate() - 1); } else break; }
  ok("the streak shown equals the consecutive count (" + n + ")", (g("streak").textContent || "").indexOf(String(n)) === 0);
  console.log(out.join("\n"));
  if (location.search.indexOf("test") >= 0) {
    var p = document.createElement("pre"); p.textContent = out.join("\n");
    p.style.cssText = "position:fixed;left:0;right:0;bottom:0;background:#111;color:#eee;padding:12px;font:12px ui-monospace,monospace;z-index:99999;max-height:40vh;overflow:auto;white-space:pre-wrap";
    document.body.appendChild(p);
  }
  return out;
};
</script>
<style id="app-theme">
  /* Today Card's own look: warm paper, serif, ink-green. web-kit writes the
     palette as INLINE styles on <html>, so these need !important to win - that
     is why an earlier attempt at theming this from a plain :root rule did nothing. */
  :root{
    --bg:#fbf7ee !important; --card:#fffdf7 !important; --ink:#1e1b15 !important;
    --mut:#6f6656 !important; --line:#e7ddc7 !important; --acc:#177245 !important;
  }
  html,body{
    background-image:repeating-linear-gradient(to bottom,transparent 0 33px,
      color-mix(in srgb,var(--line) 40%,transparent) 33px 34px) !important;
    background-attachment:fixed !important;
  }
  body,button,input,textarea{font-family:ui-serif,Georgia,"Iowan Old Style",serif !important}
  h1{font-size:2.4rem !important;letter-spacing:-.02em !important;font-weight:600 !important}
  .card{
    background:var(--card) !important;border:1px solid var(--line) !important;
    border-radius:8px !important;
    box-shadow:0 1px 2px rgba(60,50,30,.06),0 14px 34px -22px rgba(60,50,30,.55) !important;
  }
  /* the fields read like lines written on the card, not boxes */
  input,textarea{
    background:transparent !important;border:none !important;
    border-bottom:1.5px solid var(--line) !important;border-radius:0 !important;
    padding:10px 2px !important;font-size:1.05rem !important;color:var(--ink) !important;
  }
  input:focus,textarea:focus{
    outline:none !important;border-bottom-color:var(--acc) !important;
    box-shadow:0 1px 0 0 var(--acc) !important;
  }
  input::placeholder,textarea::placeholder{color:var(--mut) !important;font-style:italic !important}
  button{
    border-radius:4px !important;font-family:ui-sans-serif,system-ui,sans-serif !important;
    font-weight:600 !important;letter-spacing:.01em !important;
  }
  button:not(.ghost){
    background:var(--acc) !important;color:#fff !important;border:none !important;
    border-bottom:3px solid #0f5634 !important;padding:13px 20px !important;
  }
  button.ghost{
    background:transparent !important;color:var(--mut) !important;
    border:1px solid var(--line) !important;
  }
  button.ghost:hover{color:var(--ink) !important;border-color:var(--ink) !important}
  .big{font-family:ui-serif,Georgia,serif !important;font-weight:600 !important}
  .mut{color:var(--mut) !important}
  header{border-bottom:1px solid var(--line) !important}
</style>
</body>

</html>
